; XIAO ESP32S3 + MCP2515 (8 MHz) as an ISOBUS implement (VT client)
; Based on the AgIsoStack++ example examples/virtual_terminal/esp32_platformio_object_pool
;
; NOTE: this uses ESP-IDF (not Arduino) and the official espressif32 platform the
; AgIsoStack++ example is tested with. The first build downloads ESP-IDF, which takes a while.

[env:xiao]
platform = espressif32@6.10.0
board = seeed_xiao_esp32s3
framework = espidf

; Pinned to one library version (31 Oct 2026) so both ends match and updates can't break the build
lib_deps = https://github.com/Open-Agriculture/AgIsoStack-plus-plus.git#9e9e70c35ad10259db524c0ed8ec63cd8dca078e
board_build.embed_files = src/object_pool/object_pool.iop

build_flags = -Wno-error=missing-field-initializers

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time